name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cabal:
    name: cabal / GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.4.8", "9.6.6"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "3.10"

      - name: Install the surreal binary
        run: |
          curl -sSf https://install.surrealdb.com | sh
          echo "SURREAL_BIN=$HOME/.surrealdb/surreal" >> "$GITHUB_ENV"
          "$HOME/.surrealdb/surreal" version || true

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            cabal-${{ runner.os }}-${{ matrix.ghc }}-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all --test-show-details=direct

  stack:
    name: stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true

      - name: Install the surreal binary
        run: |
          curl -sSf https://install.surrealdb.com | sh
          echo "SURREAL_BIN=$HOME/.surrealdb/surreal" >> "$GITHUB_ENV"

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', '**/*.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-

      - name: Build
        run: stack build --test --no-run-tests

      - name: Test
        run: stack test
